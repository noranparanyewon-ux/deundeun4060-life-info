<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>페이지를 불러오는 중입니다 | 든든한 4060 생활정보</title>
    <script>
      (function () {
        var repositoryBase = "/deundeun4060-life-info";
        var path = window.location.pathname;
        var base = path.indexOf(repositoryBase + "/") === 0 ? repositoryBase : "";
        var route = path.slice(base.length) || "/";
        var target = base + "/?redirect=" + encodeURIComponent(route + window.location.search + window.location.hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body><p>요청한 페이지를 불러오는 중입니다.</p></body>
</html>
